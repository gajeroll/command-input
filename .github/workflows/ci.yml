name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Lint and compile
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: |
          ls /Applications | grep -i xcode || true
          if [ -d /Applications/Xcode_16.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          elif [ -d /Applications/Xcode_16.2.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app
          fi
          xcodebuild -version
          swift --version
      - name: Lint
        run: xcrun swift-format lint --recursive Sources Tests Package.swift
      - name: Test
        run: make test
      - name: Compile
        run: make compile SIGN_IDENTITY=-
      - name: Universal compile
        run: |
          make compile-universal
          lipo -archs "build/Command Input.app/Contents/MacOS/CommandInput" | grep -q arm64
          lipo -archs "build/Command Input.app/Contents/MacOS/CommandInput" | grep -q x86_64
