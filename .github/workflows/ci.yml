name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Lint and compile
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_16.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          fi
          xcodebuild -version
      - name: Lint
        run: xcrun swift-format lint --recursive Sources
      - name: Compile
        run: make compile SIGN_IDENTITY=-
